services:
  # PostgreSQL 16 with pgvector Extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_sales_assistant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_2026
      POSTGRES_DB: ai_sales_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7.2 Cache & Pub/Sub
  redis:
    image: redis:7.2-alpine
    container_name: ai_sales_assistant_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Express API Container (Optional Containerized Dev)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai_sales_assistant_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgres_secure_password_2026@postgres:5432/ai_sales_assistant?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "dev_jwt_secret_super_secure_key_min_32_chars_2026_xai_commerce"
      JWT_EXPIRES_IN: "7d"
      JWT_REFRESH_SECRET: "dev_jwt_refresh_super_secure_key_min_32_chars_2026_xai"
      JWT_REFRESH_EXPIRES_IN: "30d"
      OPENAI_API_KEY: "sk-mock-development-key"
      OPENAI_MODEL: "gpt-4o"
      RAZORPAY_KEY_ID: "rzp_test_mock_key_id"
      RAZORPAY_KEY_SECRET: "mock_key_secret_for_test_mode"
      RAZORPAY_WEBHOOK_SECRET: "mock_webhook_secret_key"
      LOG_LEVEL: "debug"
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full-stack

  # Frontend Next.js Container (Optional Containerized Dev)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai_sales_assistant_web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api/v1"
    ports:
      - "3000:3000"
    depends_on:
      - api
    profiles:
      - full-stack

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
